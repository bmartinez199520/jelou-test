services:
  api:
    image: node:22.10.0
    container_name: nestjs-api
    restart: always
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    ports:
      - "3000:3000"
    depends_on:
      - mysql
      - redis
      - mongodb
    env_file:
      - .env
    volumes:
      - ./:/app
      - /app/node_modules
      - logs:/app/logs

  mysql:
    image: mysql:8.0
    container_name: nestjs-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=jelou
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:alpine
    container_name: nestjs-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/var/lib/redis

  mongodb:
    image: mongo:latest
    container_name: nestjs-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/var/lib/mongodb

volumes:
  mysql-data:
  redis-data:
  mongodb-data:
  logs:
